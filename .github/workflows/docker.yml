name: Docker

on:
  push:
    tags:
      - "v*"

concurrency:
  group: docker-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY_IMAGE: ghcr.io/superworldsavior/mcp-calculix

jobs:
  qualify:
    runs-on: ubuntu-latest
    env:
      MCP_VIEW_LOCAL_ROOT: ${{ github.workspace }}/.deps/mcp-server/packages/view
      MCP_VIEW_CONTRACTS_LOCAL_ROOT: ${{ github.workspace }}/.deps/mcp-server/packages/view-contracts
      MCP_VIEW_COMPONENTS_LOCAL_ROOT: ${{ github.workspace }}/.deps/mcp-server/packages/view-components
    steps:
      - uses: actions/checkout@v5
      - name: Checkout the exact split mcp-view source
        uses: actions/checkout@v5
        with:
          repository: Casys-AI/mcp-server
          ref: b08802df353bb25d25a1c8d64b22ea61b5287ae0
          path: .deps/mcp-server
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Require the release tag to match the package version
        run: test "${GITHUB_REF_NAME}" = "v$(deno eval 'console.log(JSON.parse(Deno.readTextFileSync("deno.json")).version)')"
      - name: Install native Gmsh and CalculiX release oracles
        run: sudo apt-get update && sudo apt-get install -y gmsh calculix-ccx
      - name: Execute a native Gmsh mesh smoke test
        run: gmsh -3 tests/fixtures/bracket.step -format inp -o /tmp/mcp-calculix-release.inp && test -s /tmp/mcp-calculix-release.inp
      - name: Verify source release gates
        run: deno task release:check
      - name: Execute native Gmsh and CalculiX release suite
        run: deno task test:native

  build-push:
    needs: qualify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_status="$(curl -sS -o /tmp/existing-release.json -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME")"
          case "$release_status" in
            404) ;;
            200)
              echo "Release $GITHUB_REF_NAME already exists; refusing to republish mutable image tags." >&2
              exit 1
              ;;
            *)
              echo "Could not prove that release $GITHUB_REF_NAME is absent (HTTP $release_status)." >&2
              exit 1
              ;;
          esac

      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build release image for native static smoke
        run: docker build --load --tag mcp-calculix:release-smoke .

      - name: Execute native static solve smoke inside release image
        run: >-
          docker run --rm --entrypoint sh mcp-calculix:release-smoke -c
          'CALCULIX_RUN_NATIVE=1 deno test --cached-only --allow-all --filter
          "physical observations" tests/solve_test.ts'

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6

      - name: Verify the exact JSR release before recording it
        run: |
          version="${GITHUB_REF_NAME#v}"
          commit="$(git rev-parse HEAD)"
          checkout="$PWD"
          cd "$(mktemp -d)"
          for attempt in $(seq 1 30); do
            if deno run --no-config --no-lock --reload \
              --minimum-dependency-age=0 \
              --allow-read="$checkout" --allow-net=jsr.io,rekor.sigstore.dev \
              "$checkout/scripts/verify-jsr-release.ts" \
              "$checkout" "$version" "$commit" \
              --repository "$GITHUB_REPOSITORY"; then
              exit 0
            fi
            if [ "$attempt" -lt 30 ]; then
              sleep 10
            fi
          done
          echo "JSR release @casys/mcp-calculix@${version} was not importable." >&2
          exit 1

      - name: Record the exact published release identity
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          if ! [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Published image digest is missing or malformed: $IMAGE_DIGEST" >&2
            exit 1
          fi
          commit="$(git rev-parse HEAD)"
          jq -n \
            --arg version "${GITHUB_REF_NAME#v}" \
            --arg tag "$GITHUB_REF_NAME" \
            --arg commit "$commit" \
            --arg jsr "jsr:@casys/mcp-calculix@${GITHUB_REF_NAME#v}" \
            --arg image "$REGISTRY_IMAGE@$IMAGE_DIGEST" \
            '{schema_version:"1.0",version:$version,tag:$tag,commit:$commit,jsr:$jsr,image:$image,platforms:["linux/amd64","linux/arm64"]}' \
            > release-identity.json
          jq -e \
            --arg version "${GITHUB_REF_NAME#v}" \
            --arg tag "$GITHUB_REF_NAME" \
            --arg commit "$commit" \
            --arg image "$REGISTRY_IMAGE@$IMAGE_DIGEST" \
            '.schema_version == "1.0" and
             .version == $version and .tag == $tag and .commit == $commit and
             (.jsr == ("jsr:@casys/mcp-calculix@" + $version)) and
             (.image == $image) and
             .platforms == ["linux/amd64", "linux/arm64"]' \
            release-identity.json >/dev/null

      - name: Publish the GitHub release identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "mcp-calculix ${GITHUB_REF_NAME#v}" \
            --notes "Bounded CalculiX MCP release. Deploy the exact GHCR digest recorded in release-identity.json." \
            release-identity.json
